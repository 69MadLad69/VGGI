<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Surface of Revolution of a Parabola</title>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a1a1a;
        font-family: monospace;
        color: #fff;
    }

    #canvas-holder {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    #webglcanvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    #controls {
        position: absolute;
        top: 0;
        left: 0;
        width: 260px;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        padding: 15px;
        box-sizing: border-box;
        border-right: 1px solid #444;
        transition: transform 0.3s ease;
        overflow-y: auto;
    }

    #controls.hidden {
        transform: translateX(-100%);
    }

    .toggle-menu {
        position: absolute;
        top: 15px;
        left: 270px;
        background: #2196F3;
        color: #fff;
        border: none;
        padding: 8px 12px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
        transition: background 0.3s;
        z-index: 10;
    }

    .toggle-menu:hover {
        background: #0b7dda;
    }

    h3 {
        margin: 10px 0 20px 0;
        font-size: 14px;
        border-bottom: 1px solid #444;
        padding-bottom: 8px;
    }

    .control-group {
        margin: 10px 0;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
    }

    input[type="range"] {
        width: 100%;
    }

    .value-display {
        float: right;
        font-size: 12px;
    }

    button {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 8px 15px;
        margin: 5px 0;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
    }

    button:hover {
        background: #45a049;
    }

    .info {
        font-size: 11px;
        color: #888;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #333;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./main.js"></script>
<script src="./model.js"></script>

</head>
<body onload="init()">

<div id="canvas-holder">
    <canvas id="webglcanvas"></canvas>

    <div id="controls">
        <h3>Surface of Revolution of Parabola</h3>

        <div class="control-group">
            <label>a (distance): <span id="aValue" class="value-display">0.80</span></label>
            <input type="range" id="aSlider" min="-5" max="5" step="0.01" value="0.8">
        </div>

        <div class="control-group">
            <label>c (coefficient): <span id="cValue" class="value-display">2.00</span></label>
            <input type="range" id="cSlider" min="0.1" max="3" step="0.1" value="2">
        </div>

        <div class="control-group">
            <label>θ (theta): <span id="thetaValue" class="value-display">0.63</span></label>
            <input type="range" id="thetaSlider" min="-3.14" max="3.14" step="0.01" value="0.628">
        </div>

        <div class="control-group">
            <label>t range: <span id="tRangeValue" class="value-display">2.00</span></label>
            <input type="range" id="tRangeSlider" min="0.5" max="4" step="0.1" value="2">
        </div>

        <div class="control-group">
            <label>Resolution: <span id="resValue" class="value-display">50</span></label>
            <input type="range" id="resSlider" min="10" max="100" step="5" value="50">
        </div>

        <button id="preset1">Fig.1 (θ=0.2π)</button>
        <button id="preset2">Fig.2 (θ=π/2)</button>
        <button id="preset3">Fig.3 (θ=-π/2)</button>
        <button id="preset4">Fig.4 (θ=-2π/5)</button>

        <div class="control-group">
            <button id="resetView">Reset to Original</button>
        </div>

        <div class="info">
            <strong>Controls:</strong><br>
            • Drag to rotate<br>
            • Scroll to zoom<br>
            • Hide menu: toggle button<br>
        </div>
    </div>

    <button class="toggle-menu" id="toggleMenu">Hide Menu</button>
</div>


<script>
let zoom = 10;

function resizeCanvasToDisplaySize(canvas) {
    const displayWidth = canvas.clientWidth * window.devicePixelRatio;
    const displayHeight = canvas.clientHeight * window.devicePixelRatio;

    if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
        canvas.width = displayWidth;
        canvas.height = displayHeight;
        if (gl) gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    }
}

function handleZoom(event) {
    zoom += event.deltaY * 0.05;
    zoom = Math.min(Math.max(zoom, 2), 80);
    draw();
}

document.addEventListener('wheel', handleZoom);
window.addEventListener('resize', () => {
    const canvas = document.getElementById('webglcanvas');
    resizeCanvasToDisplaySize(canvas);
    draw();
});

const controls = document.getElementById('controls');
const toggleBtn = document.getElementById('toggleMenu');
toggleBtn.addEventListener('click', () => {
    controls.classList.toggle('hidden');
    toggleBtn.textContent = controls.classList.contains('hidden') ? 'Show Menu' : 'Hide Menu';
    toggleBtn.style.left = controls.classList.contains('hidden') ? '10px' : '270px';
});

window.addEventListener('load', () => {
    const canvas = document.getElementById('webglcanvas');
    resizeCanvasToDisplaySize(canvas);
});

const initialParams = {
  a: 0.8,
  c: 2.0,
  theta: 0.2 * Math.PI,
  tRange: 2.0,
  res: 50
};

params.a = initialParams.a;
params.c = initialParams.c;
params.theta = initialParams.theta;
params.tMin = -initialParams.tRange;
params.tMax = initialParams.tRange;
params.uSteps = initialParams.res;
params.tSteps = initialParams.res;

const aSlider = document.getElementById("aSlider");
const cSlider = document.getElementById("cSlider");
const thetaSlider = document.getElementById("thetaSlider");
const tRangeSlider = document.getElementById("tRangeSlider");
const resSlider = document.getElementById("resSlider");

const aValue = document.getElementById("aValue");
const cValue = document.getElementById("cValue");
const thetaValue = document.getElementById("thetaValue");
const tRangeValue = document.getElementById("tRangeValue");
const resValue = document.getElementById("resValue");

function updateDisplay() {
  if (!params) return;
  aValue.textContent = (params.a ?? 0).toFixed(2);
  cValue.textContent = (params.c ?? 0).toFixed(2);
  thetaValue.textContent = (params.theta ?? 0).toFixed(2);
  const tRange = Math.abs(params.tMax ?? 2);
  tRangeValue.textContent = tRange.toFixed(2);
  resValue.textContent = (params.uSteps ?? 50).toFixed(0);
}


function syncSliders() {
  aSlider.value = params.a;
  cSlider.value = params.c;
  thetaSlider.value = params.theta;
  tRangeSlider.value = params.tRange;
  resSlider.value = params.res;
}

function triggerSurfaceUpdate() {
  if (typeof updateSurface === "function") {
    updateSurface();
  }
}

aSlider.addEventListener("input", () => {
  params.a = parseFloat(aSlider.value);
  updateDisplay();
  updateSurface();
});

cSlider.addEventListener("input", () => {
  params.c = parseFloat(cSlider.value);
  updateDisplay();
  updateSurface();
});

thetaSlider.addEventListener("input", () => {
  params.theta = parseFloat(thetaSlider.value);
  updateDisplay();
  updateSurface();
});

tRangeSlider.addEventListener("input", () => {
  params.tRange = parseFloat(tRangeSlider.value);
  updateDisplay();
  updateSurface();
});

resSlider.addEventListener("input", () => {
  params.res = parseInt(resSlider.value);
  updateDisplay();
  updateSurface();
});

function setPreset(a, c, theta) {
  params.a = a;
  params.c = c;
  params.theta = theta;
  aSlider.value = a;
  cSlider.value = c;
  thetaSlider.value = theta;
  updateDisplay();
  updateSurface();
}

document.getElementById("preset1").addEventListener("click", () => {
  // Fig 1: a = 0.8 m; c = 2; θ = 0.2π
  setPreset(0.8, 2.0, 0.2 * Math.PI);
});
document.getElementById("preset2").addEventListener("click", () => {
  // Fig 2: a = 0; c = 1; θ = π/2
  setPreset(0.0, 1.0, Math.PI / 2);
});
document.getElementById("preset3").addEventListener("click", () => {
  // Fig 3: a = 0.8; c = 1; θ = -π/2
  setPreset(0.8, 1.0, -Math.PI / 2);
});
document.getElementById("preset4").addEventListener("click", () => {
  // Fig 4: a = 0.8; c = 1; θ = -2π/5
  setPreset(0.8, 1.0, -2 * Math.PI / 5);
});

document.getElementById("resetView").addEventListener("click", () => {
  params.a = initialParams.a;
  params.c = initialParams.c;
  params.theta = initialParams.theta;
  params.tMin = -initialParams.tRange;
  params.tMax = initialParams.tRange;
  params.uSteps = initialParams.res;
  params.tSteps = initialParams.res;

  aSlider.value = params.a;
  cSlider.value = params.c;
  thetaSlider.value = params.theta;
  tRangeSlider.value = initialParams.tRange;
  resSlider.value = initialParams.res;

  updateDisplay();
  updateSurface();
});

updateDisplay();
syncSliders();

</script>

</body>
</html>
